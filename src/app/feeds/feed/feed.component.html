<div class="main-content">
  <app-loader *ngIf="!items && !errorMessage"></app-loader>
  <app-error-message [message]="errorMessage" *ngIf="!items && errorMessage !==''"></app-error-message>

  <div *ngIf="items">
    <p class="job-header" *ngIf="feedType === 'jobs'">
      These are jobs at startups that were funded by Y Combinator.
      You can also get a job at a YC startup through <a href="https://triplebyte.com/?ref=yc_jobs">Triplebyte</a>.
    </p>
    <div class="author-filter" *ngIf="showAuthorFilter">
      <input type="text" name="authorFilter" placeholder="Filter by author" aria-label="Filter by author"
        [(ngModel)]="authorFilter">
      <button type="button" class="clear" *ngIf="authorFilter" (click)="clearAuthorFilter()">Clear</button>
    </div>
    <app-story-list *ngIf="feedType !== 'new'" [items]="visibleItems" [ranks]="visibleRanks" [listStart]="listStart"
      [listMargin]="listMargin"></app-story-list>
    <p class="no-matches" *ngIf="visibleItems.length === 0 && authorFilter">
      No stories by an author matching “{{ authorFilter }}” on this page.
    </p>
    <div class="nav">
      <a *ngIf="listStart !== 1" [routerLink]="['/' + feedType, pageNum - 1]" routerLinkActive="active" class="prev">
        ‹ Prev
      </a>
      <a *ngIf="items.length === 30" [routerLink]="['/' + feedType, pageNum + 1]" routerLinkActive="active" class="more">
        More ›
      </a>
    </div>
  </div>
</div>
