<div class="main-content">
  <app-loader *ngIf="!items && !errorMessage"></app-loader>
  <app-error-message [message]="errorMessage" *ngIf="!items && errorMessage !==''"></app-error-message>

  <div *ngIf="items">
    <p class="job-header" *ngIf="feedType === 'jobs'">
      These are jobs at startups that were funded by Y Combinator.
      You can also get a job at a YC startup through <a href="https://triplebyte.com/?ref=yc_jobs">Triplebyte</a>.
    </p>
    <div class="author-filter" *ngIf="canFilterByAuthor">
      <label for="author-filter">Author</label>
      <input id="author-filter" type="search" placeholder="filter by username" [value]="authorFilter"
        (input)="onAuthorFilterChange($event.target.value)">
      <button class="clear" type="button" *ngIf="authorFilter" (click)="onAuthorFilterChange('')">clear</button>
    </div>
    <app-story-list *ngIf="feedType !== 'new'" [items]="filteredItems"></app-story-list>
    <p class="no-matches" *ngIf="items.length > 0 && filteredItems.length === 0">
      No stories by “{{ authorFilter }}” on this page.
    </p>
    <div class="nav">
      <a *ngIf="listStart !== 1" [routerLink]="['/' + feedType, pageNum - 1]" [queryParams]="filterQueryParams"
        routerLinkActive="active" class="prev">
        ‹ Prev
      </a>
      <a *ngIf="items.length === 30" [routerLink]="['/' + feedType, pageNum + 1]" [queryParams]="filterQueryParams"
        routerLinkActive="active" class="more">
        More ›
      </a>
    </div>
  </div>
</div>
