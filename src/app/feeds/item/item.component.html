<article class="story" [ngStyle]="{'margin-bottom': settings.listSpacing+'px'}">
  <p class="title-row" *ngIf="hasUrl">
    <a class="title" [ngStyle]="{'font-size': settings.titleFontSize+'px'}" href="{{item.url}}" [attr.target]="settings.openLinkInNewTab ? '_blank' : null" [attr.rel]="settings.openLinkInNewTab ? 'noopener' : null">
      {{item.title}}
    </a>
    <span *ngIf="item.domain" class="domain">({{item.domain}})</span>
  </p>
  <p class="title-row" *ngIf="!hasUrl">
    <a class="title" [ngStyle]="{'font-size': settings.titleFontSize+'px'}" [routerLink]="['/item', item.id]" routerLinkActive="active">
      {{item.title}}
    </a>
  </p>
  <div class="subtext">
    <ng-container *ngIf="item.type !== 'job'">
      <span class="points">{{item.points}} ★</span>
      <span class="name">by <a [routerLink]="['/user', item.user]" routerLinkActive="active">{{item.user}}</a></span>
    </ng-container>
    <span class="time">{{ item.time_ago }}</span>
    <a *ngIf="item.type !== 'job'" [routerLink]="['/item', item.id]" routerLinkActive="active" class="comment-number">
      {{item.comments_count | comment }}
    </a>
  </div>
</article>
