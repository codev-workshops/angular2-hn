<div class="settings-header">
  <h2 mat-dialog-title class="settings-title">Settings</h2>
  <button mat-icon-button type="button" class="close" mat-dialog-close aria-label="Close settings">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>
<mat-dialog-content class="content">
  <section class="control-section">
    <h3 class="section-title">Links</h3>
    <mat-slide-toggle class="new-tab-toggle" [checked]="settings.openLinkInNewTab" (change)="toggleOpenLinksInNewTab()">
      Open links in a new tab
    </mat-slide-toggle>
  </section>
  <section class="control-section">
    <h3 class="section-title" id="theme-label">Select a theme</h3>
    <mat-radio-group class="theme-options" aria-labelledby="theme-label" [value]="settings.theme"
      (change)="selectTheme($event.value)">
      <mat-radio-button *ngFor="let theme of themes" [value]="theme.value">{{ theme.label }}</mat-radio-button>
    </mat-radio-group>
  </section>
  <section class="control-section">
    <h3 class="section-title">Change Font</h3>
    <div class="fields">
      <mat-form-field appearance="outline">
        <mat-label>Font size</mat-label>
        <input matInput #titleFont type="number" min="1" name="titleFontSize" [value]="settings.titleFontSize"
          (input)="changeTitleFont(titleFont.value)">
        <span matSuffix>px</span>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>List spacing</mat-label>
        <input matInput #listSpacing type="number" min="0" name="listSpacing" [value]="settings.listSpacing"
          (input)="changeSpacing(listSpacing.value)">
        <span matSuffix>px</span>
      </mat-form-field>
    </div>
  </section>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" class="done" mat-dialog-close>Done</button>
</mat-dialog-actions>
