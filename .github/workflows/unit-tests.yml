name: Unit tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 12
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Unit tests with coverage gate (>=80% statements/lines/functions/branches)
        run: yarn test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/angular-hnpwa
